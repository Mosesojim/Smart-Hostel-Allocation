kind = "web"
previewPath = "/"
title = "Smart Hostel Allocation"
description = "A responsive front-end prototype for student hostel preferences, allocation tracking, room discovery, and admin allocation management using static mock data."
version = "1.0.0"
id = "artifacts/smart-hostel-allocation"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25472

[services.development]
run = "pnpm --filter @workspace/smart-hostel-allocation run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smart-hostel-allocation", "run", "build" ]
serve = "static"
publicDir = "artifacts/smart-hostel-allocation/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25472"
BASE_PATH = "/"
